name: Publish Beebeeblock pack data

on:
  push:
    branches: [main]
    paths:
      - launcher/controls-preset.txt
      - kubejs/client_scripts/lanminecraft_multiplayer_warning.js
      - tools/keybinds/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beebeeblock-pack-latest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify the pack data update
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/keybinds/check_preset.py
          work="$RUNNER_TEMP/beebeeblock-controls"
          mkdir -p "$work/before"
          gh release download pack-latest -p pack-manifest.json -D "$work/before"
          base="$work/before/pack-manifest.json"
          expected=$(sha256sum "$base" | cut -d' ' -f1)
          public=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/pack-latest" --jq '.assets[]|select(.name=="pack-manifest.json")|.digest')
          test "$public" = "sha256:$expected"
          launcher=$(jq -er '.assets[] | select(.covers | any(startswith("launcher/"))) | .name' "$base")
          scripts=$(jq -r '.assets[] | select(.covers | index("kubejs/client_scripts/lanminecraft_multiplayer_warning.js")) | .name' "$base")
          library=$(jq -er '.library.name' "$base")
          patterns=(-p "$launcher" -p "$library")
          if [[ -n "$scripts" ]]; then patterns+=(-p "$scripts"); fi
          gh release download pack-latest "${patterns[@]}" -D "$work/before"
          python3 -B tools/keybinds/stage_release.py "$base" "$work/dist"
      - name: Publish assets and update the manifest
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/beebeeblock-controls"
          base="$work/before/pack-manifest.json"
          manifest="$work/dist/pack-manifest.json"
          for file in "$work"/dist/*.zip; do
            name=$(basename "$file")
            expected=$(sha256sum "$file" | cut -d' ' -f1)
            public=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/pack-latest" --jq ".assets[]|select(.name==\"$name\")|.digest")
            if [[ -z "$public" ]]; then
              gh release upload pack-latest "$file"
            else
              test "$public" = "sha256:$expected"
            fi
            curl --fail --silent --show-error --location --retry 3 --max-time 60 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/pack-latest/$name?run=$GITHUB_RUN_ID" -o "$work/public-$name"
            cmp "$file" "$work/public-$name"
          done
          expected=$(sha256sum "$base" | cut -d' ' -f1)
          public=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/pack-latest" --jq '.assets[]|select(.name=="pack-manifest.json")|.digest')
          test "$public" = "sha256:$expected"
          if ! gh release upload pack-latest "$manifest" --clobber; then
            public=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/pack-latest" --jq '.assets[]|select(.name=="pack-manifest.json")|.id')
            if [[ -z "$public" ]]; then gh release upload pack-latest "$base"; fi
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/pack-latest/pack-manifest.json?run=$GITHUB_RUN_ID" -o "$work/public-manifest.json"
          cmp "$manifest" "$work/public-manifest.json"
          jq -e --arg rev "$GITHUB_SHA" '.revision == $rev' "$work/public-manifest.json"
